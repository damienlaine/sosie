[project]
name = "sosie"
version = "0.1.0"
description = "Your voice double: a voice-over recording studio, a library of cloned voices and speech synthesis, all local."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<2",
  "faster-whisper>=1.1",
]

[project.optional-dependencies]
# speech synthesis and voice cloning (Chatterbox Multilingual V3, a CUDA GPU strongly advised)
voice = [
  # the Multilingual V3 model is not in a PyPI release yet: same commit as the voices were judged with
  "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2",
  "pyloudnorm>=0.1",
  "num2words>=0.5.13",
]

[project.scripts]
sosie = "sosie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sosie"]

[tool.hatch.metadata]
allow-direct-references = true
